DatabaseDirectory /var/lib/clamav
TCPSocket 3310
TCPAddr 0.0.0.0
Foreground yes
LogClean no
LogVerbose no
ExtendedDetectionInfo no
StreamMaxLength 50M
MaxScanSize 100M
MaxFileSize 50M
MaxRecursion 8
MaxFiles 200
MaxScanTime 45000
MaxThreads 1
MaxQueue 4
ReadTimeout 20
CommandReadTimeout 20
SendBufTimeout 20000
AlertExceedsMax yes
FailIfCvdOlderThan 3
TemporaryDirectory /tmp
