<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111110" />
    <style>
      html { background: #111110; color-scheme: dark; }
      html[data-theme="light"] { background: #fff; color-scheme: light; }
      html[data-theme="sepia"] { background: #f0e4c9; color-scheme: light; }
    </style>
    <script>
      (() => {
        let theme = "dark";
        try {
          const stored = localStorage.getItem("armature-theme");
          if (stored === "light" || stored === "dark" || stored === "sepia") theme = stored;
        } catch {}
        document.documentElement.dataset.theme = theme;
        const color = theme === "dark" ? "#111110" : theme === "sepia" ? "#F0E4C9" : "#ffffff";
        document.querySelector('meta[name="theme-color"]').setAttribute("content", color);
      })();
    </script>
    <meta
      name="description"
      content="Armature AI Labs is a 3,500 sq ft physical AI and robotics lab in HSR Layout, Bengaluru."
    />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico?v=black-transparent-1" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png?v=black-transparent-1" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=black-transparent-1" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Armature AI Labs · The Physical AI and Robotics Lab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
